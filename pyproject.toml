[project]
name = "ece-2026-bigdata"
version = "0.1.0"
description = "Big Data labs repository - ECE 2026"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.5.0",
    "faker>=40.37.0",
    "pandas>=2.0.0",
    "pyspark>=3.5.0",
    "trino>=0.320.0",
]

[project.scripts]
dataset-users = "ece_2026_bigdata.dataset_users:main"
dataset-orders = "ece_2026_bigdata.dataset_orders:main"
orders-report = "ece_2026_bigdata.orders_report:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
